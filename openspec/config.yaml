schema: spec-driven

context: |
  Tech stack: Vite + React 19 + TypeScript + Tailwind + Vitest + PWA
  Backend: Supabase Postgres (hosted on Vercel)
  Testing: use existing Vitest unit/integration tests for verification.
  Do NOT write standalone browser-automation driver scripts (Playwright/Puppeteer)
  for manual verification unless the user explicitly asks for E2E testing.

rules:
  tasks:
    - Do not add tasks for writing Playwright/Puppeteer driver scripts or other
      manual browser-automation verification steps unless explicitly requested.
    - Verification steps should reference existing Vitest tests, type-checking,
      or build success — not new ad-hoc scripts.

operations:
  apply:
    guidance:
      - Do not create Playwright/Puppeteer driver scripts (e.g. drive.mjs) to
        verify functionality. Use existing Vitest tests, `tsc --noEmit`, or a
        successful build as verification instead.
      - If E2E browser verification is genuinely needed, ask the user for
        confirmation before writing a driver script.